name: Fetch NAV History

on:
  workflow_dispatch: {}
  schedule:
    # 16:30 UTC (~22:00 IST), Monday to Friday - after AMFI publishes the day's NAVs
    - cron: "30 16 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NAV history
        run: python fetch_nav_history.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav_history.csv nav_match_report.csv
          # --cached catches brand-new (untracked) files too; plain `git diff` does not.
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NAV history $(date -u +%Y-%m-%d)"
            git push
          fi
